<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Guru BK - MEURATEP SMA 3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

  <!-- Top Navigation Bar -->
  <nav class="bg-slate-800/80 border-b border-slate-700/80 backdrop-blur sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-amber-600/20 border border-amber-500/30 flex items-center justify-center text-amber-400 font-bold">
          BK
        </div>
        <div>
          <h1 class="text-base font-bold text-white leading-tight">MEURATEP SMA 3</h1>
          <p class="text-xs text-amber-400 font-semibold">Portal Guru Bimbingan Konseling</p>
        </div>
      </div>
      
      <!-- User Info Badge & Logout -->
      <div class="flex items-center space-x-3">
        <span id="guruBadge" class="bg-amber-950/60 border border-amber-800/50 text-amber-300 text-xs font-mono font-semibold px-3 py-1.5 rounded-lg"></span>
        <button onclick="logout()" class="text-xs text-slate-400 hover:text-rose-400 transition">Keluar</button>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="max-w-5xl mx-auto px-4 mt-6 space-y-6">

    <!-- Tab Switching -->
    <div class="flex border-b border-slate-700/80 space-x-4">
      <button id="tabCurhatBtn" onclick="switchMainTab('curhat')" class="pb-3 text-sm font-semibold border-b-2 border-amber-500 text-amber-400 transition">
        Inbox Curhat Privat
      </button>
      <button id="tabForumBtn" onclick="switchMainTab('forum')" class="pb-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-white transition">
        Forum Publik & Moderasi
      </button>
    </div>

    <!-- SEKTOR 1: INBOX CURHAT PRIVAT -->
    <section id="sectorCurhat" class="space-y-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-base font-bold text-white">Kotak Masuk Curhat Siswa</h2>
          <p class="text-xs text-slate-400">Pesan ini bersifat rahasia dan hanya dapat diakses oleh Guru BK.</p>
        </div>
        <button onclick="loadCurhats()" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg text-amber-400 transition">
          Refresh Curhat
        </button>
      </div>

      <div id="curhatContainer" class="space-y-4">
        <div class="text-center py-8 text-slate-500 text-sm">Memuat pesan curhat...</div>
      </div>
    </section>

    <!-- SEKTOR 2: FORUM PUBLIK -->
    <section id="sectorForum" class="hidden space-y-6">
      <!-- Buat Thread Baru oleh Guru -->
      <div class="bg-slate-800 border border-indigo-500/30 rounded-2xl p-4 sm:p-5 space-y-3 shadow-lg">
        <h2 class="text-sm font-bold text-indigo-300">Buat Pengumuman / Thread Baru (Guru BK)</h2>
        <textarea id="guruThreadPesan" rows="3" placeholder="Tuliskan imbauan, informasi, atau topik diskusi publik..." 
                  class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"></textarea>
        <div class="flex justify-between items-center pt-1">
          <span class="text-xs text-slate-400">Akan dipublikasikan atas nama <strong id="postingAsLabel" class="text-indigo-400"></strong></span>
          <button onclick="postGuruThread()" id="btnPostGuruThread" class="py-2 px-5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-sm transition">
            Kirim Thread
          </button>
        </div>
      </div>

      <!-- Feed Threads Forum -->
      <div class="space-y-4">
        <div class="flex items-center justify-between">
          <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Pantauan Diskusi Publik</h3>
          <button onclick="loadThreads()" class="text-xs text-indigo-400 hover:underline">Refresh Forum</button>
        </div>
        <div id="forumContainer" class="space-y-4">
          <div class="text-center py-8 text-slate-500 text-sm">Memuat thread forum...</div>
        </div>
      </div>
    </section>

  </main>

  <script>
    const WEBHOOK_URL = "https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/1342a914-f61b-478e-891d-6f9e4f7b5124";

    // Ambil akun guru dari localStorage atau atur fallback default
    let currentGuruUser = localStorage.getItem('meuratep_guru_user') || 'Guru_BK';
    let currentRole = 'guru';

    document.getElementById('guruBadge').innerText = currentGuruUser;
    document.getElementById('postingAsLabel').innerText = currentGuruUser;

    function logout() {
      localStorage.removeItem('meuratep_guru_user');
      localStorage.removeItem('meuratep_role');
      window.location.href = 'index.html';
    }

    function switchMainTab(tab) {
      const cBtn = document.getElementById('tabCurhatBtn');
      const fBtn = document.getElementById('tabForumBtn');
      const cSec = document.getElementById('sectorCurhat');
      const fSec = document.getElementById('sectorForum');

      if (tab === 'curhat') {
        cBtn.className = "pb-3 text-sm font-semibold border-b-2 border-amber-500 text-amber-400 transition";
        fBtn.className = "pb-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-white transition";
        cSec.classList.remove('hidden');
        fSec.classList.add('hidden');
        loadCurhats();
      } else {
        fBtn.className = "pb-3 text-sm font-semibold border-b-2 border-indigo-500 text-indigo-400 transition";
        cBtn.className = "pb-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-white transition";
        fSec.classList.remove('hidden');
        cSec.classList.add('hidden');
        loadThreads();
      }
    }

    // LOAD CURHAT (Mengirimkan identitas user & role agar lolos validasi n8n)
    async function loadCurhats() {
      const container = document.getElementById('curhatContainer');
      container.innerHTML = '<div class="text-center py-8 text-slate-500 text-sm">Memuat pesan curhat...</div>';

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'read_curhat',
            user: currentGuruUser,
            role: currentRole
          })
        });
        const resData = await response.json();
        const payload = Array.isArray(resData) ? resData[0] : resData;

        if (payload && payload.status === 'success' && Array.isArray(payload.data)) {
          renderCurhats(payload.data);
        } else if (payload && payload.status === 'error') {
          container.innerHTML = `<div class="text-center py-6 text-rose-400 text-sm">${escapeHtml(payload.message)}</div>`;
        } else {
          container.innerHTML = '<div class="text-center py-6 text-slate-500 text-sm">Belum ada pesan curhat masuk.</div>';
        }
      } catch (err) {
        console.error(err);
        container.innerHTML = '<div class="text-center py-6 text-rose-400 text-sm">Gagal terhubung ke server.</div>';
      }
    }

    function renderCurhats(items) {
      const container = document.getElementById('curhatContainer');
      container.innerHTML = '';

      if (items.length === 0) {
        container.innerHTML = '<div class="text-center py-6 text-slate-500 text-sm">Belum ada pesan curhat masuk.</div>';
        return;
      }

      items.forEach(curhat => {
        const card = document.createElement('div');
        card.className = "bg-slate-800 border border-amber-500/20 rounded-2xl p-4 sm:p-5 space-y-3 shadow-sm";
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-xs font-mono text-amber-400 font-semibold bg-amber-950/60 border border-amber-800/40 px-2.5 py-1 rounded-md">
              ${escapeHtml(curhat.user || 'Siswa Anonim')}
            </span>
            <span class="text-[11px] text-slate-500">${curhat.createdAt ? new Date(curhat.createdAt).toLocaleString('id-ID') : ''}</span>
          </div>
          <p class="text-sm text-slate-100 leading-relaxed whitespace-pre-line">${escapeHtml(curhat.pesan || '')}</p>
        `;
        container.appendChild(card);
      });
    }

    // LOAD THREADS FORUM
    async function loadThreads() {
      const container = document.getElementById('forumContainer');
      container.innerHTML = '<div class="text-center py-8 text-slate-500 text-sm">Memuat forum...</div>';

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'read_thread' })
        });
        const resData = await response.json();
        const payload = Array.isArray(resData) ? resData[0] : resData;

        if (payload && payload.status === 'success' && Array.isArray(payload.data)) {
          renderThreads(payload.data);
        } else {
          container.innerHTML = '<div class="text-center py-6 text-slate-500 text-sm">Belum ada thread publik.</div>';
        }
      } catch (err) {
        console.error(err);
        container.innerHTML = '<div class="text-center py-6 text-rose-400 text-sm">Gagal memuat forum.</div>';
      }
    }

    function renderThreads(items) {
      const container = document.getElementById('forumContainer');
      container.innerHTML = '';

      const mainThreads = items.filter(i => i.tipe === 'thread' || !i.tipe || !i.tipe.startsWith('reply_'));

      if (mainThreads.length === 0) {
        container.innerHTML = '<div class="text-center py-6 text-slate-500 text-sm">Belum ada thread publik.</div>';
        return;
      }

      mainThreads.forEach(thread => {
        const childReplies = items.filter(i => i.tipe === `reply_${thread.id}`);
        const card = document.createElement('div');
        card.className = "bg-slate-800 border border-slate-700/80 rounded-2xl p-4 sm:p-5 space-y-3 shadow-sm";
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-xs font-mono text-indigo-400 font-semibold bg-indigo-950/60 border border-indigo-800/40 px-2.5 py-1 rounded-md">
              ${escapeHtml(thread.user || 'Anonim')}
            </span>
            <span class="text-[11px] text-slate-500">${thread.createdAt ? new Date(thread.createdAt).toLocaleString('id-ID') : ''}</span>
          </div>
          
          <p class="text-sm text-slate-100 leading-relaxed whitespace-pre-line">${escapeHtml(thread.pesan || '')}</p>

          <div class="pt-2 border-t border-slate-700/50 flex items-center justify-between">
            <button onclick="toggleReplyTray('${thread.id}')" class="text-xs font-semibold text-indigo-400 hover:text-indigo-300 transition flex items-center space-x-1">
              💬 <span>${childReplies.length > 0 ? `Lihat/Balas (${childReplies.length})` : 'Tulis Balasan'}</span>
            </button>
          </div>

          <!-- Tray Balasan -->
          <div id="replyTray-${thread.id}" class="hidden mt-3 pl-3 sm:pl-4 border-l-2 border-indigo-500/40 space-y-3 pt-2">
            <div class="bg-slate-900/90 p-3 rounded-xl border border-slate-700 space-y-2">
              <textarea id="replyText-${thread.id}" rows="2" placeholder="Balas thread ini sebagai Guru BK..." 
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"></textarea>
              <div class="flex justify-between items-center">
                <span class="text-[10px] text-slate-500">Membalas sebagai ${escapeHtml(currentGuruUser)}</span>
                <button onclick="postGuruReply('${thread.id}')" id="btnReply-${thread.id}" class="py-1.5 px-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg text-xs transition">
                  Kirim Balasan
                </button>
              </div>
            </div>

            ${childReplies.length > 0 ? `
              <div class="space-y-2">
                ${childReplies.map(r => `
                  <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/50 space-y-1">
                    <div class="flex items-center justify-between">
                      <span class="text-[11px] font-mono text-slate-400 font-semibold">${escapeHtml(r.user || 'Anonim')}</span>
                      <span class="text-[10px] text-slate-500">${r.createdAt ? new Date(r.createdAt).toLocaleString('id-ID') : ''}</span>
                    </div>
                    <p class="text-xs text-slate-300 whitespace-pre-line">${escapeHtml(r.pesan || '')}</p>
                  </div>
                `).join('')}
              </div>
            ` : '<div class="text-xs text-slate-500 italic py-1">Belum ada balasan pada thread ini.</div>'}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleReplyTray(id) {
      const tray = document.getElementById(`replyTray-${id}`);
      if (tray) tray.classList.toggle('hidden');
    }

    // POST THREAD UTAMA OLEH GURU
    async function postGuruThread() {
      const pesan = document.getElementById('guruThreadPesan').value.trim();
      const btn = document.getElementById('btnPostGuruThread');
      if (!pesan) return alert("Pesan tidak boleh kosong!");

      btn.disabled = true;
      btn.innerText = "Mengirim...";

      try {
        await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'write_thread',
            user: currentGuruUser,
            role: currentRole,
            pesan: pesan,
            tipe: 'thread'
          })
        });
        document.getElementById('guruThreadPesan').value = '';
        loadThreads();
      } catch (err) {
        alert("Gagal mengirim thread.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Kirim Thread";
      }
    }

    // POST BALASAN OLEH GURU
    async function postGuruReply(parentId) {
      const inputEl = document.getElementById(`replyText-${parentId}`);
      const btn = document.getElementById(`btnReply-${parentId}`);
      const pesan = inputEl.value.trim();

      if (!pesan) return alert("Balasan tidak boleh kosong!");

      btn.disabled = true;

      try {
        await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'write_thread',
            user: currentGuruUser,
            role: currentRole,
            pesan: pesan,
            tipe: `reply_${parentId}`
          })
        });
        inputEl.value = '';
        await loadThreads();
        toggleReplyTray(parentId);
      } catch (err) {
        alert("Gagal mengirim balasan.");
      } finally {
        btn.disabled = false;
      }
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Load awal
    loadCurhats();
  </script>
</body>
</html>
