<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MEURATEP SMA 3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 border border-slate-700/80 rounded-2xl p-6 sm:p-8 space-y-6 shadow-2xl">
    
    <!-- Header / Logo -->
    <div class="text-center space-y-2">
      <div class="w-12 h-12 bg-indigo-600/20 border border-indigo-500/30 rounded-2xl flex items-center justify-center mx-auto text-indigo-400 font-bold text-xl">
        M3
      </div>
      <h1 class="text-xl font-bold text-white tracking-tight">MEURATEP SMA 3</h1>
      <p class="text-xs text-slate-400">Portal Layanan Konseling BK & Forum Anonim</p>
    </div>

    <!-- Mode Switcher -->
    <div class="grid grid-cols-2 gap-2 bg-slate-900 p-1.5 rounded-xl border border-slate-700/60">
      <button type="button" id="btnModeSiswa" onclick="switchLoginMode('siswa')" class="py-2 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition">
        Siswa (Anonim)
      </button>
      <button type="button" id="btnModeGuru" onclick="switchLoginMode('guru')" class="py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition">
        Guru / Pengelola
      </button>
    </div>

    <!-- Alert Message -->
    <div id="loginAlert" class="hidden bg-rose-950/60 border border-rose-800/60 text-rose-300 text-xs p-3 rounded-xl text-center"></div>

    <!-- Form 1: Siswa (Anonim) -->
    <form id="formSiswa" onsubmit="handleLoginSiswa(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Nama Panggilan / Alias (Opsional)</label>
        <input type="text" id="siswaAlias" placeholder="Contoh: Siswa_#1234 (Biarkan kosong untuk acak)" 
               class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
      </div>
      <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-sm transition shadow-lg shadow-indigo-600/30">
        Masuk Sebagai Siswa
      </button>
    </form>

    <!-- Form 2: Guru / Developer (Autentikasi Username & Password) -->
    <form id="formGuru" onsubmit="handleLoginGuru(event)" class="hidden space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Username</label>
        <input type="text" id="guruUsername" required placeholder="Masukkan username" 
               class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500 transition">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
        <input type="password" id="guruPassword" required placeholder="••••••••" 
               class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500 transition">
      </div>
      <button type="submit" id="btnSubmitGuru" class="w-full py-3 bg-amber-600 hover:bg-amber-500 text-white font-semibold rounded-xl text-sm transition shadow-lg shadow-amber-600/30">
        Masuk Portal
      </button>
    </form>

  </div>

  <script>
    const WEBHOOK_URL = "https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/1342a914-f61b-478e-891d-6f9e4f7b5124";

    function switchLoginMode(mode) {
      const btnS = document.getElementById('btnModeSiswa');
      const btnG = document.getElementById('btnModeGuru');
      const formS = document.getElementById('formSiswa');
      const formG = document.getElementById('formGuru');
      const alertDiv = document.getElementById('loginAlert');

      alertDiv.classList.add('hidden');

      if (mode === 'siswa') {
        btnS.className = "py-2 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition";
        btnG.className = "py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition";
        formS.classList.remove('hidden');
        formG.classList.add('hidden');
      } else {
        btnG.className = "py-2 text-xs font-semibold rounded-lg bg-amber-600 text-white transition";
        btnS.className = "py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition";
        formG.classList.remove('hidden');
        formS.classList.add('hidden');
      }
    }

    // Login Siswa
    function handleLoginSiswa(e) {
      e.preventDefault();
      const aliasInput = document.getElementById('siswaAlias').value.trim();
      const anonUser = aliasInput || ("Siswa_#" + Math.floor(1000 + Math.random() * 9000));

      localStorage.setItem('meuratep_anon_user', anonUser);
      localStorage.setItem('meuratep_role', 'siswa');

      window.location.href = 'siswa.html';
    }

    // Login Guru / Developer
    async function handleLoginGuru(e) {
      e.preventDefault();
      const user = document.getElementById('guruUsername').value.trim();
      const password = document.getElementById('guruPassword').value.trim();
      const btn = document.getElementById('btnSubmitGuru');
      const alertDiv = document.getElementById('loginAlert');

      alertDiv.classList.add('hidden');
      btn.disabled = true;
      btn.innerText = "Memverifikasi...";

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'login',
            user: user,
            password: password
          })
        });

        const resData = await response.json();
        const payload = Array.isArray(resData) ? resData[0] : resData;

        if (payload && (payload.status === 'success' || payload.role)) {
          const userRole = (payload.role || '').toLowerCase().trim();
          
          localStorage.setItem('meuratep_guru_user', user);
          localStorage.setItem('meuratep_role', userRole);

          // Routing berpatokan penuh pada nilai role
          if (userRole === 'guru') {
            window.location.href = 'guru.html';
          } else if (userRole === 'developer') {
            window.location.href = 'developer.html';
          } else {
            alertDiv.innerText = "Role akun tidak dikenali.";
            alertDiv.classList.remove('hidden');
          }
        } else {
          alertDiv.innerText = payload.message || "Username atau password salah.";
          alertDiv.classList.remove('hidden');
        }
      } catch (err) {
        console.error(err);

        // Fallback lokal berdasarkan data auth
        if (user === 'nibras' && password === '0') {
          localStorage.setItem('meuratep_guru_user', 'nibras');
          localStorage.setItem('meuratep_role', 'guru');
          window.location.href = 'guru.html';
        } else if (user === 'masteruser' && password === '0') {
          localStorage.setItem('meuratep_guru_user', 'masteruser');
          localStorage.setItem('meuratep_role', 'developer');
          window.location.href = 'developer.html';
        } else {
          alertDiv.innerText = "Gagal terhubung ke server autentikasi.";
          alertDiv.classList.remove('hidden');
        }
      } finally {
        btn.disabled = false;
        btn.innerText = "Masuk Portal";
      }
    }
  </script>
</body>
</html>
