<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Host - MEURATEP SMA 3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-6 sm:p-8 space-y-6">
    
    <!-- Header Logo & Title -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-emerald-600/20 text-emerald-400 mb-2 border border-emerald-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">MEURATEP SMA 3</h1>
      <p class="text-xs text-slate-400">Portal Authentikasi Guru BK & Admin System</p>
    </div>

    <!-- Form Login Host -->
    <form id="sectionHost" onsubmit="handleHostLogin(event)" class="space-y-4">
      <div id="loginError" class="hidden bg-rose-950/50 border border-rose-800/60 text-rose-300 text-xs p-3 rounded-xl"></div>

      <div class="space-y-1">
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Username / ID Host</label>
        <input type="text" id="hostUsername" required placeholder="Masukkan username" 
               class="w-full px-4 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition text-sm">
      </div>

      <div class="space-y-1">
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Password</label>
        <input type="password" id="hostPassword" required placeholder="••••••••" 
               class="w-full px-4 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition text-sm">
      </div>

      <button type="submit" id="btnSubmitHost" class="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl transition shadow-lg shadow-emerald-600/30 flex items-center justify-center space-x-2">
        <span id="btnHostText">Login Ke Dashboard</span>
        <div id="btnHostSpinner" class="hidden w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
      </button>
    </form>

    <!-- Navigation Link ke Siswa -->
    <div class="text-center pt-2">
      <a href="siswa.html" class="text-xs text-slate-400 hover:text-indigo-400 transition inline-flex items-center space-x-1">
        <span>Buka Portal Anonim Siswa</span>
        <span>&rarr;</span>
      </a>
    </div>

  </div>

  <script>
    const WEBHOOK_URL = "https://n8n-mzbmiib3etk4.kangkung.sumopod.my.id/webhook/1342a914-f61b-478e-891d-6f9e4f7b5124";

    async function handleHostLogin(e) {
      e.preventDefault();
      
      const usernameInput = document.getElementById('hostUsername').value.trim();
      const passwordInput = document.getElementById('hostPassword').value.trim();
      const errorDiv = document.getElementById('loginError');
      const btnText = document.getElementById('btnHostText');
      const btnSpinner = document.getElementById('btnHostSpinner');
      const btnSubmit = document.getElementById('btnSubmitHost');

      errorDiv.classList.add('hidden');
      btnText.innerText = "Memverifikasi...";
      btnSpinner.classList.remove('hidden');
      btnSubmit.disabled = true;

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'login',
            user: usernameInput,
            password: passwordInput
          })
        });

        const result = await response.json();
        const payload = Array.isArray(result) ? result[0] : result;

        if (payload && payload.status === 'success') {
          const userRole = (payload.role || (payload.data && payload.data.role) || '').toLowerCase().trim();
          
          localStorage.setItem('meuratep_guru_user', usernameInput);
          localStorage.setItem('meuratep_role', userRole);

          if (userRole === 'guru' || userRole === 'guru_bk') {
            window.location.href = 'guru.html';
          } else if (userRole === 'developer') {
            window.location.href = 'developer.html';
          } else {
            errorDiv.innerText = "Role akun tidak memiliki akses ke Dashboard Host.";
            errorDiv.classList.remove('hidden');
          }
        } else {
          errorDiv.innerText = payload.message || "Username atau password salah.";
          errorDiv.classList.remove('hidden');
        }
      } catch (err) {
        console.error(err);

        // Fallback Auth Lokal jika webhook offline
        if (usernameInput === 'nibras' && passwordInput === '0') {
          localStorage.setItem('meuratep_guru_user', 'nibras');
          localStorage.setItem('meuratep_role', 'guru');
          window.location.href = 'guru.html';
        } else if (usernameInput === 'masteruser' && passwordInput === '0') {
          localStorage.setItem('meuratep_guru_user', 'masteruser');
          localStorage.setItem('meuratep_role', 'developer');
          window.location.href = 'developer.html';
        } else {
          errorDiv.innerText = "Gagal terhubung ke server autentikasi.";
          errorDiv.classList.remove('hidden');
        }
      } finally {
        btnText.innerText = "Login Ke Dashboard";
        btnSpinner.classList.add('hidden');
        btnSubmit.disabled = false;
      }
    }
  </script>
</body>
</html>
